name: Deploy FastAPI to Azure Container Apps

on:
  push:
    branches:
      - main

env:
  ACR_NAME: acrhelloktzmjackie
  IMAGE_NAME: fastapi-hello
  CONTAINER_APP: aca-hello-fastapi
  RESOURCE_GROUP: <your-resource-group>

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build Docker image
        run: |
          docker build -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} ./app

      - name: Login to ACR
        run: |
          az acr login --name $ACR_NAME

      - name: Push image
        run: |
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      - name: Deploy Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}
